<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>響應式 Canvas 與虛擬 D-Pad</title>
  <style>
    /* 基礎重置與頁面排版 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* 防止手機觸控按鈕時誤選文字 */
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      gap: 20px;
    }

    /* RWD 1:1 Canvas 容器 */
    .canvas-container {
      width: 100%;
      max-width: 500px; /* 電腦版最大寬度，可自行調整 */
      aspect-ratio: 1 / 1; /* 強制保持 1:1 比例 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      border: 3px solid #00ffcc;
      border-radius: 8px;
      background-color: #000000;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    /* 十字虛擬 D-Pad 排版 */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
      justify-content: center;
      align-items: center;
    }

    /* 半透明按鈕基本樣式 */
    .btn-dir {
      background-color: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.1s, transform 0.1s;
      backdrop-filter: blur(4px); /* 背景模糊效果 */
      touch-action: manipulation; /* 優化觸控回應 */
    }

    /* 按壓效果 */
    .btn-dir:active, .btn-dir.active {
      background-color: rgba(0, 255, 204, 0.5);
      border-color: #00ffcc;
      transform: scale(0.95);
    }

    /* D-Pad 按鈕位置定格 */
    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <!-- 1:1 Canvas 區域 -->
  <div class="canvas-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
  </div>

  <!-- 半透明虛擬 D-Pad -->
  <div class="d-pad">
    <button class="btn-dir" id="btn-up">▲</button>
    <button class="btn-dir" id="btn-left">◀</button>
    <button class="btn-dir" id="btn-right">▶</button>
    <button class="btn-dir" id="btn-down">▼</button>
  </div>

  <script>
    // 1. 初始化 Canvas 繪圖上下文
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 在 Canvas 上渲染簡單提示文字
    function drawPlaceholder() {
      ctx.fillStyle = '#00ffcc';
      ctx.font = '20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Canvas (1:1)', canvas.width / 2, canvas.height / 2);
    }
    drawPlaceholder();

    // 2. 處理方向說明的核心函式
    function handleDirection(direction) {
      console.log(`[Input]: ${direction}`);
    }

    // 3. 虛擬 D-Pad 觸控/點擊事件監聽
    const dPadButtons = {
      'btn-up': 'Up',
      'btn-down': 'Down',
      'btn-left': 'Left',
      'btn-right': 'Right'
    };

    Object.entries(dPadButtons).forEach(([id, dir]) => {
      const btn = document.getElementById(id);
      
      // 使用 pointerdown 可同時支援滑鼠點擊與觸控螢幕
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); // 防止手機預設雙擊放大等行為
        handleDirection(dir);
      });
    });

    // 4. 實體鍵盤 (方向鍵 & WASD) 監聽
    const keyMap = {
      'ArrowUp': 'Up',
      'KeyW': 'Up',
      'w': 'Up',
      'W': 'Up',

      'ArrowDown': 'Down',
      'KeyS': 'Down',
      's': 'Down',
      'S': 'Down',

      'ArrowLeft': 'Left',
      'KeyA': 'Left',
      'a': 'Left',
      'A': 'Left',

      'ArrowRight': 'Right',
      'KeyD': 'Right',
      'd': 'Right',
      'D': 'Right'
    };

    window.addEventListener('keydown', (e) => {
      // 檢查發生的按鍵是否在對應表內
      if (keyMap[e.key] || keyMap[e.code]) {
        const dir = keyMap[e.key] || keyMap[e.code];
        handleDirection(dir);

        // 觸發對應 UI 按鈕的視覺反饋效果
        const btnId = `btn-${dir.toLowerCase()}`;
        const btn = document.getElementById(btnId);
        if (btn) {
          btn.classList.add('active');
          setTimeout(() => btn.classList.remove('active'), 150);
        }
      }
    });
  </script>
</body>
</html>
