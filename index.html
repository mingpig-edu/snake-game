<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貪食蛇遊戲 - 關卡與防爆演算法</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      gap: 15px;
    }

    /* 頂部資訊列與關卡選擇器 */
    .controls-header {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    select, button.game-btn {
      background-color: #333;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .score-board {
      font-size: 18px;
      font-weight: bold;
      color: #00ffcc;
    }

    /* RWD 1:1 Canvas 容器 */
    .canvas-container {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      border: 3px solid #00ffcc;
      border-radius: 8px;
      background-color: #000000;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    /* 十字虛擬 D-Pad 排版 */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
      justify-content: center;
      align-items: center;
    }

    .btn-dir {
      background-color: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.1s, transform 0.1s;
      backdrop-filter: blur(4px);
      touch-action: manipulation;
    }

    .btn-dir:active, .btn-dir.active {
      background-color: rgba(0, 255, 204, 0.5);
      border-color: #00ffcc;
      transform: scale(0.95);
    }

    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <!-- 控制列與分數 -->
  <div class="controls-header">
    <label for="levelSelect">關卡：</label>
    <select id="levelSelect">
      <option value="1">Level 1 - 簡單 (簡單邊框)</option>
      <option value="2">Level 2 - 中等 (中央十字)</option>
      <option value="3">Level 3 - 困難 (迷宮障礙)</option>
    </select>
    <div class="score-board">得分: <span id="score">0</span></div>
  </div>

  <!-- 1:1 Canvas 區域 -->
  <div class="canvas-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
  </div>

  <!-- 半透明虛擬 D-Pad -->
  <div class="d-pad">
    <button class="btn-dir" id="btn-up">▲</button>
    <button class="btn-dir" id="btn-left">◀</button>
    <button class="btn-dir" id="btn-right">▶</button>
    <button class="btn-dir" id="btn-down">▼</button>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. 常數與遊戲設定
    // ----------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const levelSelect = document.getElementById('levelSelect');

    const GRID_SIZE = 20; // 20x20 網格
    const TILE_COUNT = 20;
    const TILE_SIZE = canvas.width / GRID_SIZE; // 每格 25px
    const GAME_SPEED = 120; // 遊戲更新間隔 (毫秒)

    // ----------------------------------------------------
    // 2. 3 款固定難度地圖設計 (0: 空位, 1: 牆壁/障礙物)
    // ----------------------------------------------------
    function createBaseMap() {
      // 創建 20x20 基礎空地圖
      return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
    }

    function getMap(level) {
      const map = createBaseMap();
      
      // 所有關卡均加上四周邊框牆
      for (let i = 0; i < GRID_SIZE; i++) {
        map[0][i] = 1;
        map[GRID_SIZE - 1][i] = 1;
        map[i][0] = 1;
        map[i][GRID_SIZE - 1] = 1;
      }

      if (level === 2) {
        // Level 2 中等：中央十字障礙物
        for (let i = 7; i <= 12; i++) {
          map[10][i] = 1;
          map[i][10] = 1;
        }
      } else if (level === 3) {
        // Level 3 困難：四角障礙與中央障礙
        // 中央障礙
        for (let i = 8; i <= 11; i++) {
          map[8][i] = 1;
          map[11][i] = 1;
        }
        // 四角柱子
        const pillars = [[4,4], [4,15], [15,4], [15,15]];
        pillars.forEach(([r, c]) => {
          map[r][c] = 1;
          map[r+1][c] = 1;
          map[r][c+1] = 1;
          map[r+1][c+1] = 1;
        });
      }

      return map;
    }

    // ----------------------------------------------------
    // 3. 遊戲狀態變數
    // ----------------------------------------------------
    let currentLevel = 1;
    let currentMap = getMap(currentLevel);
    let snake = [];
    let direction = { x: 1, y: 0 }; // 初始向右
    let nextDirection = { x: 1, y: 0 };
    let food = null;
    let score = 0;
    let gameInterval = null;
    let isGameOver = false;

    // ----------------------------------------------------
    // 4. 重置與初始化遊戲
    // ----------------------------------------------------
    function initGame() {
      currentMap = getMap(currentLevel);
      score = 0;
      scoreElement.innerText = score;
      isGameOver = false;

      // 重置蛇的位置（固定生成於左上角安全區域）
      snake = [
        { x: 3, y: 2 },
        { x: 2, y: 2 },
        { x: 1, y: 2 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };

      // 生成第一個食物
      spawnFood();

      // 重置定時器
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, GAME_SPEED);
    }

    // ----------------------------------------------------
    // 5. 防爆食物生成演算法 (重點需求)
    // ----------------------------------------------------
    function spawnFood() {
      const emptyCells = [];

      // 遍歷整個 20x20 地圖
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          // 檢查是否為牆壁
          if (currentMap[r][c] === 1) continue;

          // 檢查是否為蛇身
          const isSnake = snake.some(segment => segment.x === c && segment.y === r);
          if (isSnake) continue;

          // 若非牆壁且非蛇身，紀錄為可用空位
          emptyCells.push({ x: c, y: r });
        }
      }

      // 特殊判定：若無任何空位，代表已填滿整個可移動區域，通關！
      if (emptyCells.length === 0) {
        clearInterval(gameInterval);
        alert(`🎉 恭喜通關 Level ${currentLevel}！獲得滿分！`);
        return;
      }

      // 從空位清單中隨機抽取一個座標
      const randomIndex = Math.floor(Math.random() * emptyCells.length);
      food = emptyCells[randomIndex];
    }

    // ----------------------------------------------------
    // 6. 遊戲核心循環 (Game Loop)
    // ----------------------------------------------------
    function gameLoop() {
      update();
      draw();
    }

    function update() {
      if (isGameOver) return;

      // 更新方向
      direction = { ...nextDirection };

      // 計算新蛇頭座標
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // A. 撞牆 / 邊界碰撞判定
      if (
        head.x < 0 || head.x >= GRID_SIZE ||
        head.y < 0 || head.y >= GRID_SIZE ||
        currentMap[head.y][head.x] === 1
      ) {
        handleDeath();
        return;
      }

      // B. 撞到自己碰撞判定
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        handleDeath();
        return;
      }

      // 蛇頭推進
      snake.unshift(head);

      // C. 吃食物判定
      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.innerText = score;
        spawnFood(); // 重新生成食物
      } else {
        // 沒有吃到食物則移除尾巴維持長度
        snake.pop();
      }
    }

    // 撞牆/死亡處理：當關分數歸零，當關立即重來
    function handleDeath() {
      isGameOver = true;
      console.log("[Game Over]: 碰撞死亡，當關重置！");
      alert(`撞到障礙物！得分歸零，重來當關 Level ${currentLevel}。`);
      initGame();
    }

    // ----------------------------------------------------
    // 7. 畫面渲染 (Draw)
    // ----------------------------------------------------
    function draw() {
      // 清空 Canvas
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // A. 繪製地圖牆壁/障礙物
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (currentMap[r][c] === 1) {
            ctx.fillStyle = '#555555';
            ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
          }
        }
      }

      // B. 繪製食物
      if (food) {
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.arc(
          food.x * TILE_SIZE + TILE_SIZE / 2,
          food.y * TILE_SIZE + TILE_SIZE / 2,
          TILE_SIZE / 2 - 2,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      // C. 繪製蛇身
      snake.forEach((segment, index) => {
        // 蛇頭與蛇身著色區分
        ctx.fillStyle = index === 0 ? '#00ffcc' : '#00aa88';
        ctx.fillRect(
          segment.x * TILE_SIZE + 1,
          segment.y * TILE_SIZE + 1,
          TILE_SIZE - 2,
          TILE_SIZE - 2
        );
      });
    }

    // ----------------------------------------------------
    // 8. 方向控制邏輯 (包含防 180 度反轉)
    // ----------------------------------------------------
    function setDirection(dirName) {
      if (dirName === 'Up' && direction.y === 0) nextDirection = { x: 0, y: -1 };
      if (dirName === 'Down' && direction.y === 0) nextDirection = { x: 0, y: 1 };
      if (dirName === 'Left' && direction.x === 0) nextDirection = { x: -1, y: 0 };
      if (dirName === 'Right' && direction.x === 0) nextDirection = { x: 1, y: 0 };
    }

    // 虛擬 D-Pad 事件監聽
    const dPadButtons = {
      'btn-up': 'Up',
      'btn-down': 'Down',
      'btn-left': 'Left',
      'btn-right': 'Right'
    };

    Object.entries(dPadButtons).forEach(([id, dir]) => {
      const btn = document.getElementById(id);
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        setDirection(dir);
      });
    });

    // 實體鍵盤監聽
    const keyMap = {
      'ArrowUp': 'Up', 'KeyW': 'Up', 'w': 'Up', 'W': 'Up',
      'ArrowDown': 'Down', 'KeyS': 'Down', 's': 'Down', 'S': 'Down',
      'ArrowLeft': 'Left', 'KeyA': 'Left', 'a': 'Left', 'A': 'Left',
      'ArrowRight': 'Right', 'KeyD': 'Right', 'd': 'Right', 'D': 'Right'
    };

    window.addEventListener('keydown', (e) => {
      const dir = keyMap[e.key] || keyMap[e.code];
      if (dir) {
        setDirection(dir);

        // UI 按鈕按壓效果
        const btnId = `btn-${dir.toLowerCase()}`;
        const btn = document.getElementById(btnId);
        if (btn) {
          btn.classList.add('active');
          setTimeout(() => btn.classList.remove('active'), 150);
        }
      }
    });

    // 關卡切換事件
    levelSelect.addEventListener('change', (e) => {
      currentLevel = parseInt(e.target.value, 10);
      initGame();
    });

    // 啟動遊戲
    initGame();
  </script>
</body>
</html>
